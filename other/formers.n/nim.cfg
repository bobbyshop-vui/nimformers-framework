# Flags for the Nim code that BybyLang AOT generates under build/.
# BybyLang runs `nim c -d:release --path:vendor/bybylang`; Nim also reads this
# file because it sits in a parent directory of the generated source.
# Relative paths are resolved from this file's directory.
--mm:arc
--opt:speed
--hints:off
--path:"../.."
--path:"../../test/codestral"
--path:"../../test/mamba3"
--path:"../../test/deepseek-inference"
--path:"../../test/spectron"
--path:"../../kernelfortest"
-d:codestralInference
--warning:UnusedImport:off
